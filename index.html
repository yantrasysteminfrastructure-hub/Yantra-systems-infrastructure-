    <!-- loading screen: shown until the app renders (styles inline so it paints immediately) -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 50% 45%, rgba(91, 61, 245, 0.45), transparent 70%),
          #07061a;
        transition: opacity 0.5s ease, visibility 0s 0.5s;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot__plate {
        padding: 12px 20px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 0 80px -10px rgba(123, 92, 255, 0.8);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot img {
        display: block;
        height: 52px;
        width: auto;
      }
      #boot .boot__bar {
        width: 160px;
        height: 3px;
        margin: 26px auto 0;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #boot .boot__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #fc4728, transparent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(1.03);
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot * {
          animation: none !important;
        }
      }
    </style>
